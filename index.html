<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amazon Pay • Security Gateway</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        }
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(99, 102, 241, 0.08) 50%, transparent 70%);
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 0;
            transition: all 0.5s ease;
        }
        .glow-danger {
            background: radial-gradient(circle, rgba(239, 68, 68, 0.35) 0%, rgba(185, 28, 28, 0.1) 50%, transparent 70%) !important;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 36px 24px 28px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            position: relative;
            z-index: 1;
            transition: all 0.4s ease;
        }
        .shield-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pulse-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(56, 189, 248, 0.4);
            animation: pulse-out 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        @keyframes pulse-out {
            0% { transform: scale(0.85); opacity: 0.8; }
            70% { transform: scale(1.25); opacity: 0; }
            100% { transform: scale(1.25); opacity: 0; }
        }
        .shield-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.4);
            font-size: 38px;
            transition: all 0.4s ease;
        }
        .badge-verified {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.5) !important;
        }
        .badge-danger {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%) !important;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5) !important;
        }
        h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p.subtitle {
            font-size: 13.5px;
            color: #94a3b8;
            line-height: 1.55;
            margin-bottom: 24px;
            padding: 0 8px;
        }
        .security-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
        }
        .tag {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tag-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #38bdf8;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            border: none;
            padding: 16px;
            border-radius: 18px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
            box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.5);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-action:active {
            transform: scale(0.98);
        }
        .status-container {
            display: none;
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.4;
        }
        .status-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
        .status-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }
    </style>
</head>
<body>
    <div class="ambient-glow" id="glow"></div>

    <div class="card" id="card">
        <div class="shield-wrapper">
            <div class="pulse-ring" id="pulseRing"></div>
            <div class="shield-badge" id="shieldBadge">🛡️</div>
        </div>

        <h1 id="headline">Hardware Authorization</h1>
        <p class="subtitle" id="subtext">Authenticating device profile for anti-clone security...</p>

        <div class="security-tags">
            <div class="tag"><div class="tag-dot"></div> Single Device Lock</div>
            <div class="tag"><div class="tag-dot"></div> Anti-Clone Gateway</div>
        </div>

        <button class="btn-action" id="actionBtn" onclick="processVerification()">
            ⚡ Authorize Device Now 🛡️
        </button>

        <div class="status-container" id="statusBox"></div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Live Railway Backend URL
        const BACKEND_API = "https://amazon-bot-production-267d.up.railway.app/verify";

        function getPermanentDeviceId() {
            let id = localStorage.getItem("_tg_hw_device_token");
            if (!id) {
                const screenSig = screen.width + "x" + screen.height + "_" + screen.colorDepth;
                const canvasSig = (function() {
                    try {
                        const c = document.createElement("canvas");
                        const ctx = c.getContext("2d");
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        return c.toDataURL().slice(-25);
                    } catch(e) { return "canv_err"; }
                })();
                const randPart = Math.random().toString(36).substring(2, 10);
                id = "HW_" + btoa(screenSig + "_" + canvasSig).replace(/[^a-zA-Z0-9]/g, "").slice(0, 10) + "_" + randPart;
                localStorage.setItem("_tg_hw_device_token", id);
            }
            return id;
        }

        async function processVerification() {
            const btn = document.getElementById("actionBtn");
            const box = document.getElementById("statusBox");
            const badge = document.getElementById("shieldBadge");
            const ring = document.getElementById("pulseRing");
            const glow = document.getElementById("glow");

            btn.disabled = true;
            btn.innerText = "Verifying Device...";
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const urlParams = new URLSearchParams(window.location.search);
            const userId = tg?.initDataUnsafe?.user?.id || urlParams.get("uid");

            if (!userId) {
                btn.innerText = "Error: Open in Telegram";
                return;
            }

            const deviceId = getPermanentDeviceId();

            // Client-Side Multiple Account Protection
            const storedUser = localStorage.getItem("_tg_registered_uid");
            if (storedUser && String(storedUser) !== String(userId)) {
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                badge.innerText = "🛑";
                badge.className = "shield-badge badge-danger";
                glow.className = "ambient-glow glow-danger";
                ring.style.display = "none";
                btn.style.display = "none";

                document.getElementById("headline").innerText = "Security Alert";
                document.getElementById("subtext").innerText = "Multiple accounts detected on this phone.";

                box.className = "status-container status-error";
                box.innerText = "🛑 MULTIPLE ACCOUNTS DETECTED!\nThis device is already linked to another account.";
                box.style.display = "block";
                return;
            }

            // Server-Side Verification
            try {
                const response = await fetch(BACKEND_API, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        device_id: deviceId
                    })
                });

                const result = await response.json();

                if (result.status === "ok") {
                    localStorage.setItem("_tg_registered_uid", String(userId));

                    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    badge.innerText = "✓";
                    badge.className = "shield-badge badge-verified";
                    ring.style.display = "none";
                    btn.style.display = "none";

                    document.getElementById("headline").innerText = "Device Authorized";
                    document.getElementById("subtext").innerText = "Hardware profile linked successfully.";

                    box.className = "status-container status-success";
                    box.innerText = "✓ Verified! Unlocking Dashboard...";
                    box.style.display = "block";

                    // Automatically close WebApp sheet
                    setTimeout(() => {
                        if (tg) tg.close();
                    }, 600);

                } else {
                    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                    badge.innerText = "🛑";
                    badge.className = "shield-badge badge-danger";
                    glow.className = "ambient-glow glow-danger";
                    ring.style.display = "none";
                    btn.style.display = "none";

                    document.getElementById("headline").innerText = "Access Denied";
                    document.getElementById("subtext").innerText = result.message || "Device bound to another account.";

                    box.className = "status-container status-error";
                    box.innerText = "🛑 " + (result.message || "Multiple accounts strictly prohibited!");
                    box.style.display = "block";
                }

            } catch (err) {
                btn.disabled = false;
                btn.innerText = "Retry Authorization";
                box.className = "status-container status-error";
                box.innerText = "Connection failed. Please retry.";
                box.style.display = "block";
            }
        }

        // Auto trigger upon page launch
        window.addEventListener("DOMContentLoaded", () => {
            setTimeout(processVerification, 350);
        });
    </script>
</body>
</html>
