<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amazon Pay • Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        .shield {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-confirm {
            background: linear-gradient(135deg, #10b981, #059669);
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="shield" id="icon">🛡️</div>
        <h1 id="title">Security Check</h1>
        <p id="desc">Tap below to authorize this device and unlock instant rewards.</p>

        <button class="btn" id="verifyBtn" onclick="authorizeDevice()">⚡ Authorize Device Now 🛡️</button>
        <a class="btn btn-confirm" id="confirmBtn" href="#">🚀 Start Bot Dashboard ➔</a>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function getPersistentDeviceId() {
            let id = localStorage.getItem("_tg_device_hw_id");
            if (!id) {
                const screenData = screen.width + "x" + screen.height + "_" + screen.colorDepth;
                const randPart = Math.random().toString(36).substring(2, 10);
                id = "D_" + btoa(screenData).replace(/[^a-zA-Z0-9]/g, "").slice(0, 8) + "_" + randPart;
                localStorage.setItem("_tg_device_hw_id", id);
            }
            return id;
        }

        function authorizeDevice() {
            const devId = getPersistentDeviceId();
            const urlParams = new URLSearchParams(window.location.search);
            const botUser = urlParams.get("bot") || "amazon_gc_bot";

            document.getElementById("verifyBtn").style.display = "none";
            document.getElementById("icon").innerText = "✅";
            document.getElementById("title").innerText = "Device Authorized!";
            document.getElementById("desc").innerText = "Tap the green button below to activate your bot:";

            const confirmBtn = document.getElementById("confirmBtn");
            const targetUrl = "https://t.me/" + botUser + "?start=v_" + devId;
            confirmBtn.href = targetUrl;
            confirmBtn.style.display = "block";

            // Attempt seamless transfer
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(targetUrl);
            }
        }
    </script>
</body>
</html>
