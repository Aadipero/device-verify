<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amazon Pay • Hardware Integrity</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            border-radius: 28px;
            padding: 36px 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        .shield-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #3b82f6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            margin: 0 auto 20px;
            transition: all 0.3s ease;
        }
        .badge-verified {
            background: linear-gradient(135deg, #10b981, #059669) !important;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
            line-height: 1.5;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            border: none;
            padding: 16px;
            border-radius: 18px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-action:active {
            transform: scale(0.98);
        }
        .status-success {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="shield-badge" id="badge">🛡️</div>
        <h1 id="title">Hardware Integrity Check</h1>
        <p id="desc">Authorize physical hardware profile to unlock instant rewards.</p>

        <button class="btn-action" id="actionBtn" onclick="verifyAndRedirect()">
            ⚡ Authorize Device Now 🛡️
        </button>

        <div class="status-success" id="statusBox">✓ Verified! Returning to bot...</div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function getPermanentDeviceId() {
            let id = localStorage.getItem("_tg_device_hw_id");
            if (!id) {
                const screenSig = screen.width + "x" + screen.height + "_" + screen.colorDepth;
                const canvas = document.createElement("canvas");
                const ctx = canvas.getContext("2d");
                ctx.fillText("anti-fraud", 10, 10);
                const randPart = Math.random().toString(36).substring(2, 8);
                id = "D_" + btoa(screenSig).replace(/[^a-zA-Z0-9]/g, "").slice(0, 8) + "_" + randPart;
                localStorage.setItem("_tg_device_hw_id", id);
            }
            return id;
        }

        function verifyAndRedirect() {
            const btn = document.getElementById("actionBtn");
            const badge = document.getElementById("badge");
            const title = document.getElementById("title");
            const desc = document.getElementById("desc");
            const box = document.getElementById("statusBox");

            btn.disabled = true;
            btn.innerText = "Redirecting...";
            badge.innerText = "✓";
            badge.classList.add("badge-verified");
            title.innerText = "Hardware Authorized";
            desc.innerText = "Activating bot dashboard...";
            box.style.display = "block";

            const urlParams = new URLSearchParams(window.location.search);
            const botUsername = urlParams.get("bot") || "amazon_gc_bot";
            const devId = getPermanentDeviceId();

            const targetDeepLink = "tg://resolve?domain=" + botUsername + "&start=v_" + devId;
            const targetHttpsLink = "https://t.me/" + botUsername + "?start=v_" + devId;

            // Trigger direct bot activation command
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(targetHttpsLink);
            } else {
                window.location.href = targetDeepLink;
            }

            // Close sheet instantly
            setTimeout(() => {
                if (tg) tg.close();
            }, 300);
        }
    </script>
</body>
</html>
