<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amazon Pay Security</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            border-radius: 28px;
            padding: 36px 24px;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        .shield-badge {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%);
            border: none;
            padding: 16px;
            border-radius: 18px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="shield-badge" id="icon">🛡️</div>
        <h1 id="title">Hardware Authorization</h1>
        <p id="desc">Authenticating device profile for anti-clone security...</p>
        <button class="btn-action" id="actionBtn" onclick="autoVerify()">
            ⚡ Authorize Device Now 🛡️
        </button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        function getPermanentDeviceId() {
            let id = localStorage.getItem("_tg_device_hw_id");
            if (!id) {
                const screenSig = screen.width + "x" + screen.height + "_" + screen.colorDepth;
                const randPart = Math.random().toString(36).substring(2, 10);
                id = "DEV_" + btoa(screenSig).replace(/[^a-zA-Z0-9]/g, "").slice(0, 8) + "_" + randPart;
                localStorage.setItem("_tg_device_hw_id", id);
            }
            return id;
        }

        function autoVerify() {
            const btn = document.getElementById("actionBtn");
            btn.disabled = true;
            btn.innerText = "Verifying...";

            const deviceId = getPermanentDeviceId();

            // tg.sendData automatically closes the WebApp and passes payload directly to bot
            if (tg && tg.sendData) {
                tg.sendData(JSON.stringify({
                    status: "verified",
                    dev_id: deviceId
                }));
            } else {
                // Fallback for direct browser testing
                const urlParams = new URLSearchParams(window.location.search);
                const botUsername = urlParams.get("bot") || "amazon_gc_bot";
                window.location.href = `https://t.me/${botUsername}?start=v_${deviceId}`;
            }
        }

        // Automatic run on page load
        window.addEventListener("load", () => {
            setTimeout(autoVerify, 200);
        });
    </script>
</body>
</html>
